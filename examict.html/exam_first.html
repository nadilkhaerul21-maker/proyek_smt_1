<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studeent Creativity Festival</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-600 min-h-screen font-sans place-items-center">
    <header class="text-center mb-6">
       <h1 class="text-xl font-bold text-white text-center">Student Creativity Festival</h1>
        <p class="text-gray-300">Showcase your Creativity,Skill and Innovative Ideas</p>
    </header>
    <main>
        <section>
            <form>
                <div>
                <label for="name" class="block text-sm font-medium w-full text-white">Student name:</label>
                <input type="text" id="name" name="name" placeholder="Your Full Name" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
                </div>
             <div>
                <label for="class" class="block text-sm font-medium text-white">Class:</label>
                <select id="class" name="class" class=" px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
                    <option value="X-1">X</option>
                    <option value="X-2">XI</option>
                    <option value="X-3">XII</option>
                </select>
                <div>
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>
                </div>
                <div class="border-gray-200">
                    <select name="gender" id="gender">
                    <option value="Web Development">Web development</option>
                    <option value="Iot Project">Iot Project</option>
                    <option value="Grapich Design">Graphic Design</option>
                    <option value="Public Speaking">Public Speaking</option>
                    <option value="Photography">Photography</option>
                    </select>
                </div>
                <div>
                    <input type="radio" name="team name" id="Individual" value="Individual">
                    <label for="female">Individual</label>
                </div>
                <div>
                    <input type="radio" name="team name" id="team" value="team">
                    <label for="female">team</label>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-white">Team Name:</label>
                    <input type="text" id="name" name="name" placeholder="Team's Name" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-white">Contact Number:</label>
                    <input type="text" id="name" name="name" placeholder="08xxxxxxxx" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-white">Project description:</label>
                    
                    <textarea name="" id="placeholder="Describe Your Project Description class="w-full px-3 py-2 text-xm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required></textarea>
                </div>
                <div class="items-center">
                    <button type="Register Now" class="w-full bg-blue-500 hover:bg-blue-700 justify-center text-white font-bold py-2 px-4 rounded">Register Now</button>
                </div>
                </div>
            </div>
            </div>
            </form>
        </section>
        <!--I Don't Have No Time To Make a Table,miss i'm sorry-->
    </main>
</body>
</html>
