<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Cleaning Record</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-600 min-h-screen p-4 font-sans grid place-items-center">
    <header class="text-center mb-6">
        <nav class="mb-6">
        <ul class="flex justify-center gap-4">
            <li><a href="preparationdailytest.html" class="text-white hover:text-blue-400">Home</a></li>
            <li><a href="profileCard.html" class="text-white hover:text-blue-400">Profile</a></li>
            <li><a href="schedule.html" class="text-white hover:text-blue-400">Schedule</a></li>
        </ul>
    </nav>
        <h1 class="text-3xl font-bold text-white">Classroom Cleaning Record</h1>
        <p class="text-gray-300">Please fill out the form below to record your cleaning attendance.</p>
    </header>
    <main class="w-full max-w-md bg-gray-400 rounded-lg shadow-lg p-6">
        
        <section>
         <h2 class="text-xl font-semibold text-white mb-4">Cleaning Attendance Form</h2>
        <form action="#" method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-white">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label for="class" class="block text-sm font-medium text-white">Class:</label>
                <select id="class" name="class" class=" px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
                    <option value="X-1">X-1</option>
                    <option value="X-2">X-2</option>
                    <option value="X-3">X-3</option>
                    <option value="XI-1">XI-1</option>
                    <option value="XI-2">XI-2</option>
                    <option value="XI-3">XI-3</option>
                    <option value="XII-1">XII-1</option>
                    <option value="XII-2">XII-2</option>
                    <option value="XII-3">XII-3</option>
                </select>
            </div>
            <div>
                <label for="day-time" class="block text-sm font-medium text-white">Day & Time:</label>
                <input type="datetime-local" id="day-time" name="day-time" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label for="task" class="block text-sm font-medium text-white">Task:</label>
                <input type="text" id="task" name="task" placeholder="Your Task Description" class="w-full px-3 py-2 text-sm bg-[#121235] text-white rounded border border-gray-900/80 focus:outline-none focus:border-blue-500" required>
            </div>
            <div class="items-center">
                <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 justify-center text-white font-bold py-2 px-4 rounded">Submit</button>
            </div>
        </form>
        </section>
    </main>
    </form>
    <footer class="mt-6 text-center text-gray-300">
        <p>&copy; 1945 Nadil Khaerul A. All rights reserved.</p>
</body>
</html>
